# Proposed CI for web/ (Next.js). Draft for Rithik to adopt into .github/workflows/; not active.
name: RELAY web
on:
  push:
    paths: ['web/**', 'contracts/fixtures/**']
  pull_request:
    paths: ['web/**', 'contracts/fixtures/**']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run sync-fixtures -- --check
      - run: npm test
      - run: npm run build
  e2e:
    # Browser checks against a temporary local FastAPI (synthetic identities, model none, delivery off).
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npx playwright install --with-deps chromium && npm run build
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          RELAY_PYTHON: ${{ github.workspace }}/.venv/bin/python
